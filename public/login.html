<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TurboFlow — Entrar</title>
  <link rel="icon" href="/favicon.svg?v=2" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/brand/icon-180.png?v=2">
  <meta name="theme-color" content="#0b1426">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="auth-body">
  <main class="auth-card">
    <div class="brand">
      <img src="/favicon.svg?v=2" alt="" width="40" height="40">
      <div>
        <h1>TurboFlow</h1>
        <p>Salas, chamadas e chat do time Turbo Partners</p>
      </div>
    </div>

    <div class="tabs" role="tablist" id="tabs">
      <button class="tab active" data-mode="login" role="tab">Entrar</button>
      <button class="tab" data-mode="register" role="tab">Criar conta</button>
    </div>

    <form id="authForm" novalidate>
      <label class="field" id="nameField" hidden>
        <span>Nome</span>
        <input name="name" class="input" autocomplete="name" maxlength="32" placeholder="Como o time te chama">
      </label>
      <label class="field" id="emailField">
        <span>E-mail da Turbo</span>
        <input name="email" class="input" type="email" autocomplete="email" required placeholder="voce@turbopartners.com.br">
      </label>
      <label class="field" id="passwordField">
        <span id="passwordLabel">Senha</span>
        <input name="password" class="input" type="password" autocomplete="current-password" required minlength="8" placeholder="••••••••">
      </label>
      <p class="error" id="error" role="alert"></p>
      <div class="notice" id="notice" hidden></div>
      <button class="btn primary block" type="submit" id="submitBtn">Entrar</button>
    </form>
    <button class="auth-link" type="button" id="forgotLink">Esqueci minha senha</button>
    <button class="auth-link" type="button" id="backLink" hidden>Voltar para entrar</button>
    <p class="muted small center" id="domainHint">Acesso exclusivo para e-mails da Turbo Partners</p>
  </main>

  <script type="module">
    import { getSupabase, getConfig } from '/js/supa.js';
    import { applyPrefs, loadLocalPrefs } from '/js/prefs.js';
    applyPrefs(loadLocalPrefs());

    const form = document.getElementById('authForm');
    const err = document.getElementById('error');
    const notice = document.getElementById('notice');
    const submitBtn = document.getElementById('submitBtn');
    let mode = 'login';

    const COLORS = ['#22d3ee', '#0ea5e9', '#6366f1', '#8b5cf6', '#d946ef', '#f43f5e', '#f97316', '#f59e0b', '#10b981', '#14b8a6'];
    const translate = (msg = '') => {
      if (/invalid login credentials/i.test(msg)) return 'E-mail ou senha incorretos.';
      if (/email not confirmed/i.test(msg)) return 'Confirme seu e-mail pelo link que enviamos antes de entrar.';
      if (/already registered|already been registered/i.test(msg)) return 'Esse e-mail já tem conta. Use a aba Entrar.';
      if (/database error saving new user|DOMINIO/i.test(msg)) return 'Apenas e-mails da Turbo Partners podem criar conta.';
      if (/password should be at least/i.test(msg)) return 'A senha precisa ter pelo menos 8 caracteres.';
      if (/rate limit|security purposes/i.test(msg)) return 'Muitas tentativas. Aguarde alguns minutos.';
      if (/different from the old password/i.test(msg)) return 'A nova senha precisa ser diferente da anterior.';
      if (/session missing|expired|invalid.*token/i.test(msg)) return 'O link expirou. Peça um novo em "Esqueci minha senha".';
      return msg || 'Não foi possível continuar.';
    };

    // Link "redefinir senha" do e-mail volta pra cá com #...type=recovery (lido antes do Supabase limpar a URL)
    const recovering = /type=recovery/.test(location.hash);

    let sb, cfg;
    try {
      [sb, cfg] = await Promise.all([getSupabase(), getConfig()]);
      document.getElementById('domainHint').textContent = `Acesso exclusivo para e-mails ${cfg.allowedDomains.map((d) => '@' + d).join(' ou ')}`;
      const { data } = await sb.auth.getSession();
      if (data.session && !recovering) location.replace('/');
    } catch (e) {
      err.textContent = e.message;
      submitBtn.disabled = true;
    }

    // Modos: login | register | forgot (pede o link por e-mail) | reset (define a nova senha)
    const setMode = (m) => {
      mode = m;
      document.querySelectorAll('.tab').forEach((x) => x.classList.toggle('active', x.dataset.mode === m));
      document.getElementById('tabs').hidden = m === 'forgot' || m === 'reset';
      document.getElementById('nameField').hidden = m !== 'register';
      document.getElementById('emailField').hidden = m === 'reset';
      document.getElementById('passwordField').hidden = m === 'forgot';
      document.getElementById('passwordLabel').textContent = m === 'reset' ? 'Nova senha' : 'Senha';
      document.getElementById('forgotLink').hidden = m !== 'login';
      document.getElementById('backLink').hidden = m !== 'forgot';
      submitBtn.textContent = { login: 'Entrar', register: 'Criar conta', forgot: 'Enviar link de redefinição', reset: 'Salvar nova senha' }[m];
      form.password.autocomplete = m === 'login' ? 'current-password' : 'new-password';
      err.textContent = ''; notice.hidden = true;
    };

    document.querySelectorAll('.tab').forEach((t) => t.addEventListener('click', () => setMode(t.dataset.mode)));
    document.getElementById('forgotLink').addEventListener('click', () => setMode('forgot'));
    document.getElementById('backLink').addEventListener('click', () => setMode('login'));
    if (recovering) setMode('reset');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      err.textContent = ''; notice.hidden = true;
      const email = form.email.value.trim().toLowerCase();
      const password = form.password.value;
      const name = form.name.value.trim();
      if (mode !== 'reset' && !cfg.allowedDomains.includes(email.split('@')[1] || '')) { err.textContent = `Use seu e-mail ${cfg.allowedDomains.map((d) => '@' + d).join(' ou ')}.`; return; }
      if (mode !== 'forgot' && password.length < 8) { err.textContent = 'A senha precisa ter pelo menos 8 caracteres.'; return; }
      if (mode === 'register' && !name) { err.textContent = 'Informe seu nome.'; return; }
      submitBtn.disabled = true;
      try {
        if (mode === 'forgot') {
          const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: location.origin + '/login' });
          if (error) throw error;
          notice.textContent = `Se ${email} tiver conta, enviamos um link para redefinir a senha. Confira a caixa de entrada (e o spam).`;
          notice.hidden = false;
          return;
        }
        if (mode === 'reset') {
          const { error } = await sb.auth.updateUser({ password });
          if (error) throw error;
        } else if (mode === 'register') {
          const color = COLORS[Math.floor(Math.random() * COLORS.length)];
          const { data, error } = await sb.auth.signUp({ email, password, options: { data: { name, color }, emailRedirectTo: location.origin + '/' } });
          if (error) throw error;
          if (!data.session) {
            notice.textContent = `Conta criada! Enviamos um link de confirmação para ${email}. Confirme e depois entre.`;
            notice.hidden = false;
            return;
          }
        } else {
          const { error } = await sb.auth.signInWithPassword({ email, password });
          if (error) throw error;
        }
        location.replace('/');
      } catch (ex) {
        err.textContent = translate(ex.message);
      } finally {
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
